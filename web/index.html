<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rentals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rent" class="screen" hidden>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand"><b id="r-title"></b><span id="r-sub"></span></div>
      <nav id="r-cats"></nav>
      <div id="r-policy"></div>
      <div class="rail-foot" id="r-wallet"></div>
    </aside>
    <div class="shell-main">
      <div class="shell-head">
        <div class="shell-title"><h1 id="r-head"></h1></div>
        <div class="shell-actions"><button class="btn btn-icon" id="r-close" aria-label="Close"></button></div>
      </div>
      <div class="rent-body">
        <div class="fleet" id="r-fleet"></div>
        <div class="detail" id="r-detail"></div>
      </div>
    </div>
  </div>
</div>

<div id="receipt" class="screen" hidden><div class="panel" id="rc-panel"></div></div>

<div id="admin" class="screen" hidden>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand"><b>Rentals</b><span>Admin panel</span></div>
      <nav id="ad-tabs"></nav>
    </aside>
    <div class="ed-list" id="ad-list">
      <div class="ed-list-head" id="ad-list-head"></div>
      <div class="ed-rows" id="ad-rows"></div>
    </div>
    <div class="shell-main">
      <div class="shell-head">
        <div class="shell-title"><h1 id="ad-title"></h1></div>
        <div class="shell-actions" id="ad-actions"></div>
      </div>
      <div class="shell-body" id="ad-body"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
